[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "contextbridge-adapter-actions"
version = "0.1.0"
description = "Strict, owner-scoped external action adapter for ContextBridge"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Angus Uelsmann"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
contextbridge-actions-adapter = "contextbridge_actions_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextbridge_actions_adapter"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
